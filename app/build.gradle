import org.gradle.api.tasks.PathSensitivity

plugins {
    alias(libs.plugins.android.application)
}

// Robolectric resolves android-all jars via Maven local layout (not Gradle test classpath). Sync the
// pre-instrumented jar here so unit tests do not hit Maven Central from the JVM (SSL/proxy issues).
configurations {
    robolectricMavenLocalJars {
        canBeConsumed = false
        canBeResolved = true
    }
}

def robolectricMavenLocalRoot = layout.buildDirectory.dir('robolectric-m2-local')

tasks.register('prepareRobolectricMavenLocal') {
    group = 'verification'
    description = 'Stage Robolectric android-all-instrumented jars into a local Maven repo for unit tests.'
    dependsOn configurations.robolectricMavenLocalJars
    outputs.dir(robolectricMavenLocalRoot)
    doLast {
        def root = robolectricMavenLocalRoot.get().asFile
        configurations.robolectricMavenLocalJars.resolvedConfiguration.resolvedArtifacts.each { ra ->
            def mid = ra.moduleVersion.id
            if (mid.group != 'org.robolectric' || mid.name != 'android-all-instrumented') {
                return
            }
            def version = mid.version
            def destDir = file("${root}/org/robolectric/android-all-instrumented/${version}")
            destDir.mkdirs()
            copy {
                from ra.file
                into destDir
            }
        }
    }
}

tasks.withType(Test).configureEach { task ->
    if (task.name.contains('UnitTest')) {
        task.dependsOn('prepareRobolectricMavenLocal')
    }
}

def bundledGamepadAssetsRoot = layout.buildDirectory.dir('generated/bundled-gamepad-assets')

/** When this changes, {@link com.openterface.keymod.gamepad.GamepadLayoutPresetRepository} re-seeds preset_default from assets. */
def gamepadDefaultFingerprintFile = rootProject.file('gamepad/default.json')
def bundledGamepadDefaultFingerprint = '0'
if (gamepadDefaultFingerprintFile.exists()) {
    def crc = new java.util.zip.CRC32()
    crc.update(gamepadDefaultFingerprintFile.bytes)
    bundledGamepadDefaultFingerprint = Long.toUnsignedString(crc.getValue())
}

tasks.register('syncBundledGamepadPresets') {
    description = 'Copy repo-root gamepad/*.json into generated assets bundled_gamepad/. BuildConfig.BUNDLED_GAMEPAD_DEFAULT_FINGERPRINT tracks gamepad/default.json so the app can re-seed preset_default when it changes. Other JSON files become optional pack presets.'
    // Without inputs, Gradle can mark this task UP-TO-DATE after the first build, so new gamepad/*.json
    // files never get copied into assets and bundled pack presets disappear from the app.
    def gamepadSrcDir = rootProject.file('gamepad')
    inputs.dir(gamepadSrcDir).withPathSensitivity(PathSensitivity.RELATIVE).optional()
    outputs.dir(bundledGamepadAssetsRoot)
    doLast {
        def outRoot = bundledGamepadAssetsRoot.get().asFile
        def outDir = new File(outRoot, 'bundled_gamepad')
        outDir.deleteDir()
        outDir.mkdirs()
        def src = rootProject.file('gamepad')
        if (src.isDirectory()) {
            copy {
                from(src)
                include '**/*.json'
                into outDir
            }
        }
    }
}

android {
    namespace 'com.openterface.keymod'
    compileSdk 35

    defaultConfig {
        applicationId "com.openterface.KeyCmd"
        minSdk 21
        targetSdk 35
        versionCode 37
        versionName "0.37"

        setProperty("archivesBaseName", "KeyCmd")

        buildConfigField 'String', 'BUNDLED_GAMEPAD_DEFAULT_FINGERPRINT', "\"${bundledGamepadDefaultFingerprint}\""
        buildConfigField 'String', 'HELP_CONFIG_URL', '"https://assets.openterface.com/keymod/android/tutorial/config.json"'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Release signing requires explicit properties — never fall back to a
            // hardcoded default. CI builds MUST set these via -P or gradle.properties.
            // Falling back silently previously used "password"/"password" which is a
            // real signing-key security hole (anyone with the repo can re-sign APKs).
            def storePwd = project.findProperty("RELEASE_STORE_PASSWORD")
            def keyPwd = project.findProperty("RELEASE_KEY_PASSWORD")
            def alias = project.findProperty("RELEASE_KEY_ALIAS")
            def storeF = project.findProperty("RELEASE_STORE_FILE")
            storeFile file(storeF ?: "keystore.jks")
            // Only validate credentials when a release task is actually requested.
            // signingConfigs.release is evaluated at configuration time even for
            // assembleDebug, so throwing unconditionally would break local dev.
            def isReleaseBuild = gradle.startParameter.taskNames.any {
                it.contains("release") || it.contains("Release")
            }
            if (isReleaseBuild && storePwd == null) {
                throw new GradleException(
                        "RELEASE_STORE_PASSWORD is required for release builds. " +
                        "Set it in gradle.properties or via -PRELEASE_STORE_PASSWORD=...")
            }
            if (isReleaseBuild && keyPwd == null) {
                throw new GradleException(
                        "RELEASE_KEY_PASSWORD is required for release builds. " +
                        "Set it in gradle.properties or via -PRELEASE_KEY_PASSWORD=...")
            }
            storePassword storePwd != null ? storePwd : ""
            keyAlias alias != null ? alias : "keymod"
            keyPassword keyPwd != null ? keyPwd : ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.md', 'META-INF/LICENSE-notice.md',
                         'META-INF/versions/*/OSGI-INF/MANIFEST.MF']
        }
    }

    testOptions {
        unitTests {
            all {
                systemProperty 'maven.repo.local', robolectricMavenLocalRoot.get().asFile.absolutePath
            }
        }
    }

    sourceSets {
        main {
            assets.srcDir(bundledGamepadAssetsRoot)
        }
    }

}

tasks.named('preBuild').configure { dependsOn('syncBundledGamepadPresets') }

dependencies {

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.viewpager2
    testImplementation libs.junit
    testImplementation libs.robolectric
    // API 28 (@Config in GamepadLayoutPresetRepositoryTest) + compileSdk 35 app package loading.
    robolectricMavenLocalJars 'org.robolectric:android-all-instrumented:9-robolectric-4913185-2-i6'
    robolectricMavenLocalJars 'org.robolectric:android-all-instrumented:14-robolectric-10818077-i6'
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation libs.usb.serial.for.android
    implementation 'com.polidea.rxandroidble2:rxandroidble:1.19.0'
    
    // AndroidX Preferences
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    
    // Gson for JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'

    // SSH client for Terminal feature
    implementation 'com.github.mwiede:jsch:0.2.17'

    // Apache MINA SSHD for OpenSSH-compatible key generation
    implementation 'org.apache.sshd:sshd-common:2.14.0'
    implementation 'net.i2p.crypto:eddsa:0.3.0'

    // BouncyCastle (required by JSch for certain ciphers)
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    
    // Glide for image loading (GIF/PNG/WebP) in help guide overlays
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // ExoPlayer for MP4 video playback in tutorial overlay
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
}