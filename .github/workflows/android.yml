name: Build APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      # Ignore commits made by the Bump Version / Create Release workflows.
      - 'app/build.gradle'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          # PRs from forks cannot write the Gradle cache; non-PRs may update it.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Prepare signing keystore
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
          echo "RELEASE_STORE_FILE=keystore.jks" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.ALIAS }}" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> gradle.properties

      - name: Clean Gradle
        run: ./gradlew clean --info

      # Release signing uses repo secrets + keystore only on push; PRs have no secrets file.
      - name: Build Release APK
        if: github.event_name != 'pull_request'
        run: ./gradlew assembleRelease --stacktrace --info --warning-mode all

      - name: Build Debug APK (pull requests)
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --stacktrace --info --warning-mode all

      - name: Upload Release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: KeyCmd-release
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload Debug APK (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: KeyCmd-debug
          path: |
            app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/
            **/*.log
          retention-days: 7
